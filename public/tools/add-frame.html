<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Add a frame</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ui-bg:#f1f1f4; --ui-card:#ffffff; --ui-text:#0a0a0a; --ui-text2:#8a8a8e; --ui-text3:#b6b6ba;
    --ui-sep:rgba(60,60,67,.10); --ui-ink:#141414; --ui-onink:#ffffff; --ui-track:#d9d9de;
    --page:#efeee9;
  }
  html,body{height:100%}
  body{background:var(--page);color:var(--ui-text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
  [hidden]{display:none!important}

  .page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .scaler{transform-origin:top center}

  .phone{width:340px;height:738px;background:#0b0b0c;border-radius:54px;padding:13px;position:relative;
    box-shadow:0 0 0 2px #34343a inset,0 2px 2px rgba(0,0,0,.4) inset,0 30px 60px -22px rgba(0,0,0,.5),0 12px 30px -14px rgba(0,0,0,.36)}
  .island{position:absolute;top:23px;left:50%;transform:translateX(-50%);width:118px;height:34px;background:#000;border-radius:999px;z-index:6}
  .side{position:absolute;background:linear-gradient(180deg,#3d3d41,#232326);z-index:4}
  .btn-action{left:-2px;top:150px;width:3.5px;height:28px;border-radius:3px 0 0 3px}
  .btn-volup{left:-2.5px;top:196px;width:3.5px;height:54px;border-radius:3px 0 0 3px}
  .btn-voldn{left:-2.5px;top:262px;width:3.5px;height:54px;border-radius:3px 0 0 3px}
  .btn-power{right:-2.5px;top:214px;width:3.5px;height:92px;border-radius:0 3px 3px 0}
  .phone.bare{padding:0;border-radius:0;box-shadow:none}
  .phone.bare .side,.phone.bare .island{display:none}

  .screen{width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--ui-bg);display:flex;flex-direction:column;position:relative}
  .phone.bare .screen{border-radius:0}
  .status{height:54px;flex:0 0 54px}

  .topbtns{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:15;display:flex;gap:10px}
  .topbtn{height:42px;padding:0 22px;border-radius:999px;font:inherit;font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.14)}
  .topbtn svg{flex:0 0 auto}
  .topbtn.sec{background:var(--ui-card);border:.5px solid var(--ui-sep);color:var(--ui-text)}
  .topbtn.pri{background:var(--ui-ink);border:0;color:var(--ui-onink)}
  .topbtn:active{transform:scale(.96)}
  @keyframes menupop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
  .confirm-wrap{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.34);padding:0 28px}
  .confirm{width:100%;max-width:264px;background:var(--ui-card);border-radius:16px;overflow:hidden;text-align:center;animation:menupop .19s cubic-bezier(.22,.61,.36,1)}
  .confirm-body{padding:20px 18px 16px}
  .confirm h3{font-size:16px;font-weight:600;margin-bottom:5px}
  .confirm p{font-size:13px;color:var(--ui-text2);line-height:1.45}
  .confirm-btns{display:flex;border-top:.5px solid var(--ui-sep)}
  .confirm-btns button{flex:1;padding:13px;font:inherit;font-size:16px;background:none;border:0;cursor:pointer;color:var(--ui-text)}
  .confirm-btns button+button{border-left:.5px solid var(--ui-sep)}
  .cbtn-ok{color:#e0322f;font-weight:600}

  .empty{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 24px}
  .editor{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
  .drop{width:100%;border:1.5px dashed var(--ui-sep);border-radius:18px;padding:36px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--ui-card)}
  .dropicon{width:58px;height:58px;border-radius:16px;background:var(--ui-bg);display:flex;align-items:center;justify-content:center;color:var(--ui-text2);margin-bottom:16px}
  .drop h2{font-size:19px;font-weight:600;letter-spacing:-.01em}
  .drop p{margin:6px 0 20px;font-size:13px;color:var(--ui-text2);line-height:1.5}
  .choose{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 26px;border-radius:13px;background:var(--ui-ink);color:var(--ui-onink);font-size:15px;font-weight:600;cursor:pointer}

  .preview{flex:1;min-height:0;background:var(--ui-bg);display:flex;align-items:center;justify-content:center;position:relative}
  .wall{position:relative;display:flex;align-items:center;justify-content:center;background:#e7e3db;border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.1),0 14px 30px rgba(0,0,0,.1)}
  .art{position:relative;background:#17140f;padding:6%;border-radius:2px;box-shadow:0 6px 14px rgba(0,0,0,.3),0 16px 30px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 4px rgba(0,0,0,.4)}
  .mat{position:relative;width:100%;height:100%;background:#fff;padding:10%;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
  .photo{position:relative;width:100%;height:100%;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.18);background:#eee}
  .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .sig{position:absolute;left:85%;top:88%;transform:translate(-50%,-50%);font-family:"Snell Roundhand","Apple Chancery",cursive;font-style:italic;color:#14110c;white-space:nowrap;line-height:1;cursor:grab;touch-action:none;user-select:none}
  .sig img{display:block}
  .sig.empty{display:none}

  .toolzone{flex:0 0 auto;background:var(--ui-bg);border-top:.5px solid var(--ui-sep);position:relative;padding-bottom:20px}
  .tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 12px 6px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:7px 13px;font:inherit;font-size:14px;color:var(--ui-text2);background:none;border:0;border-radius:9px;cursor:pointer;white-space:nowrap;transition:background .25s ease,color .25s ease}
  .tab.on{color:var(--ui-text);font-weight:600;background:var(--ui-card)}
  .panels{overflow:hidden;transition:height .4s cubic-bezier(.22,.61,.36,1)}
  .panel{padding-bottom:2px;animation:panelin .34s cubic-bezier(.22,.61,.36,1)}
  @keyframes panelin{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
  .preview.animating .wall,.preview.animating .art,.preview.animating .mat,.preview.animating .sig,.preview.animating .sig img{transition:width .42s cubic-bezier(.22,.61,.36,1),height .42s cubic-bezier(.22,.61,.36,1),padding .42s cubic-bezier(.22,.61,.36,1),font-size .42s cubic-bezier(.22,.61,.36,1),left .42s cubic-bezier(.22,.61,.36,1),top .42s cubic-bezier(.22,.61,.36,1)}
  .arow{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 6px;scrollbar-width:none}
  .arow::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto;border:.5px solid var(--ui-sep);background:var(--ui-card);color:var(--ui-text);font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .2s ease,color .2s ease,border-color .2s ease}
  .pill.sel{background:var(--ui-ink);color:var(--ui-onink);border-color:transparent}
  .card{background:var(--ui-card);border-radius:13px;margin:0 16px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:11px 15px;min-height:46px}
  .row+.row{border-top:.5px solid var(--ui-sep)}
  .row .lab{font-size:15px;flex:0 0 66px}
  .row .val{font-size:14px;color:var(--ui-text2);flex:0 0 30px;text-align:right;font-variant-numeric:tabular-nums}
  .sws{display:flex;gap:11px;margin-left:auto;overflow-x:auto;overflow-y:hidden;max-width:190px;padding:5px 6px;scrollbar-width:none}
  .sws::-webkit-scrollbar{display:none}
  .sw{width:26px;height:26px;border-radius:50%;border:.5px solid var(--ui-sep);cursor:pointer;flex:0 0 auto;transition:box-shadow .2s ease}
  .sw.sel{box-shadow:0 0 0 2px var(--ui-card),0 0 0 4px var(--ui-ink)}
  .sw-toggle{width:46px;height:28px;border-radius:999px;background:var(--ui-track);position:relative;cursor:pointer;transition:background .2s;flex:0 0 auto;margin-left:auto}
  .sw-toggle.on{background:#34c759}
  .sw-toggle::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
  .sw-toggle.on::after{transform:translateX(18px)}
  .plus{width:30px;height:30px;border-radius:50%;border:0;background:var(--ui-ink);color:var(--ui-onink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .sig-remove{width:30px;height:30px;border-radius:50%;border:.5px solid var(--ui-sep);background:var(--ui-card);color:var(--ui-text2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-right:8px}
  .sig-remove:active{background:var(--ui-bg)}
  .sigstate{margin-left:auto;font-size:14px;color:var(--ui-text2);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
  .pos{display:grid;grid-template-columns:repeat(3,1fr);width:74px;height:74px;margin-left:auto;border-radius:9px;overflow:hidden;border:.5px solid var(--ui-sep)}
  .pcell{display:flex;align-items:center;justify-content:center;border:.5px solid var(--ui-sep);cursor:pointer}
  .pcell i{width:6px;height:6px;border-radius:50%;background:var(--ui-text3)}
  .pcell.sel i{background:var(--ui-ink);transform:scale(1.6)}

  .sld{-webkit-appearance:none;appearance:none;flex:1;height:28px;background:transparent;cursor:pointer}
  .sld::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--ui-ink) var(--fill,50%),var(--ui-track) var(--fill,50%))}
  .sld::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.05);margin-top:-11px}
  .sld::-moz-range-track{height:4px;border-radius:2px;background:var(--ui-track)}
  .sld::-moz-range-progress{height:4px;border-radius:2px;background:var(--ui-ink)}
  .sld::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}

  .home{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:128px;height:5px;border-radius:3px;background:var(--ui-text);opacity:.22}

  .sheet-wrap{position:absolute;inset:0;z-index:50;pointer-events:none}
  .sheet-wrap.open{pointer-events:auto}
  .sheet-bd{position:absolute;inset:0;background:rgba(0,0,0,.34);opacity:0;transition:opacity .28s}
  .sheet-wrap.open .sheet-bd{opacity:1}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--ui-card);border-radius:22px 22px 0 0;padding:12px 18px 24px;transform:translateY(112%);transition:transform .32s cubic-bezier(.22,.61,.36,1)}
  .sheet-wrap.open .sheet{transform:translateY(0)}
  .grab{width:36px;height:5px;border-radius:3px;background:var(--ui-text3);margin:0 auto 14px}
  .seg2{display:flex;background:var(--ui-bg);border-radius:10px;padding:3px;margin-bottom:14px}
  .seg2 button{flex:1;border:0;background:transparent;color:var(--ui-text2);font:inherit;font-size:14px;padding:8px;border-radius:8px;cursor:pointer}
  .seg2 button.on{background:var(--ui-card);color:var(--ui-text);box-shadow:0 1px 3px rgba(0,0,0,.14)}
  .tin{width:100%;height:44px;border:.5px solid var(--ui-sep);border-radius:11px;background:var(--ui-bg);color:var(--ui-text);font-size:16px;padding:0 14px}
  .sublab{font-size:12.5px;color:var(--ui-text2);margin:14px 0 8px}
  .fonts{display:flex;gap:8px;flex-wrap:wrap;max-height:128px;overflow-y:auto}
  .fchip{padding:7px 13px;border:.5px solid var(--ui-sep);border-radius:10px;font-size:17px;line-height:1;cursor:pointer;background:var(--ui-bg);color:var(--ui-text)}
  .fchip.sel{border-color:var(--ui-ink);box-shadow:0 0 0 1px var(--ui-ink)}
  .sws2{display:flex;gap:12px;flex-wrap:wrap}
  #drawpad{width:100%;height:150px;background:var(--ui-bg);border-radius:12px;display:block;touch-action:none;cursor:crosshair}
  .draw-tools{display:flex;align-items:center;gap:10px;margin-top:10px}
  .pen-sizes{display:flex;gap:6px;margin-right:auto}
  .pen-sizes button{width:34px;height:30px;border-radius:8px;border:.5px solid var(--ui-sep);background:var(--ui-bg);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .pen-sizes button.on{border-color:var(--ui-ink);box-shadow:0 0 0 1px var(--ui-ink)}
  .pen-sizes button i{background:var(--ui-text);border-radius:50%;display:block}
  .draw-btn{padding:8px 13px;border-radius:9px;border:.5px solid var(--ui-sep);background:var(--ui-bg);color:var(--ui-text);font:inherit;font-size:14px;cursor:pointer}
  .cropview{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5}
  #cropimg{max-width:86%;max-height:calc(100% - 44px);display:block;user-select:none;-webkit-user-drag:none}
  .cropbox{position:absolute;outline:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4);cursor:move;touch-action:none}
  .crop-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.4) 0 0),linear-gradient(rgba(255,255,255,.4) 0 0),linear-gradient(rgba(255,255,255,.4) 0 0),linear-gradient(rgba(255,255,255,.4) 0 0);background-repeat:no-repeat;background-size:100% 1px,100% 1px,1px 100%,1px 100%;background-position:0 33.33%,0 66.66%,33.33% 0,66.66% 0}
  .crop-h{position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.4);touch-action:none}
  .crop-h[data-h=nw]{left:-8px;top:-8px;cursor:nwse-resize}
  .crop-h[data-h=ne]{right:-8px;top:-8px;cursor:nesw-resize}
  .crop-h[data-h=sw]{left:-8px;bottom:-8px;cursor:nesw-resize}
  .crop-h[data-h=se]{right:-8px;bottom:-8px;cursor:nwse-resize}
  .crop-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 16px 0}
  .cropdone{background:var(--ui-ink);color:var(--ui-onink);border:0;font-weight:600;display:flex;align-items:center;gap:6px}
  .seclab{font-size:12px;font-weight:600;color:var(--ui-text2);padding:6px 20px 7px}
  .card+.seclab{padding-top:16px}
  .seg-mini{display:flex;background:var(--ui-bg);border-radius:9px;padding:2px;margin-left:auto}
  .seg-mini button{border:0;background:none;color:var(--ui-text2);font:inherit;font-size:13px;padding:6px 13px;border-radius:7px;cursor:pointer}
  .seg-mini button.on{background:var(--ui-card);color:var(--ui-text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .choose2{display:flex;align-items:center;justify-content:center;height:46px;border-radius:12px;background:var(--ui-bg);border:.5px dashed var(--ui-sep);color:var(--ui-text);font-size:15px;cursor:pointer}
  .upprev{margin-top:12px;height:70px;display:flex;align-items:center;justify-content:center;background:var(--ui-bg);border-radius:12px}
  .upprev img{max-height:56px;max-width:80%;object-fit:contain}
  .done{width:100%;height:48px;margin-top:18px;border:0;border-radius:13px;background:var(--ui-ink);color:var(--ui-onink);font:inherit;font-size:16px;font-weight:600;cursor:pointer}
  .exlist{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .exopt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:13px 16px;border:.5px solid var(--ui-sep);border-radius:13px;background:var(--ui-bg);cursor:pointer;font:inherit;text-align:left}
  .exopt b{display:block;font-size:16px;font-weight:600;color:var(--ui-text)}
  .exopt i{display:block;font-size:12.5px;color:var(--ui-text2);font-style:normal;margin-top:2px}
  .exopt em{font-size:12px;color:var(--ui-text3);font-style:normal;flex:0 0 auto}

  /* ===== Desktop / tablet (>=768px): drop the phone mockup, use a big canvas + right sidebar ===== */
  body.desktop .page{padding:0;min-height:100vh;display:block}
  body.desktop .scaler{transform-origin:top left}
  body.desktop .phone{border-radius:0;box-shadow:none;background:var(--page)}
  body.desktop .screen{border-radius:0;background:var(--page)}
  body.desktop .status{height:60px;flex:0 0 60px;background:var(--ui-card);border-bottom:.5px solid var(--ui-sep)}
  body.desktop .topbtns{top:13px;right:26px;left:auto;transform:none}
  body.desktop .editor{flex-direction:row}
  body.desktop .preview{min-width:0;background:var(--ui-bg)}
  body.desktop .toolzone{flex:0 0 384px;width:384px;display:flex;flex-direction:column;overflow:hidden;border-top:0;border-left:.5px solid var(--ui-sep);background:var(--ui-bg);padding:0}
  body.desktop .tabs{padding:18px 20px 12px;gap:6px;flex-wrap:wrap;overflow:visible;border-bottom:.5px solid var(--ui-sep)}
  body.desktop .tab{padding:8px 15px}
  body.desktop .panels{flex:1 1 auto;height:auto!important;overflow-y:auto;padding:16px 4px 28px}
  body.desktop .home{display:none}
  body.desktop .empty{padding:0}
  body.desktop .drop{max-width:460px}
  /* signature + export sheets become centered modals on desktop */
  body.desktop .sheet{left:50%;right:auto;top:50%;bottom:auto;width:430px;max-width:calc(100vw - 48px);max-height:calc(100vh - 96px);overflow-y:auto;border-radius:20px;padding:22px 22px 24px;transform:translate(-50%,-50%) scale(.96);opacity:0;transition:transform .26s cubic-bezier(.22,.61,.36,1),opacity .26s}
  body.desktop .sheet-wrap.open .sheet{transform:translate(-50%,-50%) scale(1);opacity:1}
  body.desktop .grab{display:none}
  /* Narrower sidebar on smaller (tablet) widths so the canvas keeps the majority of the space */
  @media (min-width:768px) and (max-width:899px){ body.desktop .toolzone{flex:0 0 320px;width:320px} }

  @media (max-width:767px){ .page{padding:0;min-height:100dvh} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="page">
  <div class="scaler" id="scaler">
    <div class="phone" id="phone">
      <div class="side btn-action"></div>
      <div class="side btn-volup"></div>
      <div class="side btn-voldn"></div>
      <div class="side btn-power"></div>
      <div class="island"></div>
      <div class="screen">
        <div class="status"></div>

        <div class="topbtns" id="topbtns" hidden>
          <button class="topbtn sec" id="replaceBtn">Replace<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4"/><path d="M3 8h13"/><path d="M17 20l4-4-4-4"/><path d="M21 16H8"/></svg></button>
          <button class="topbtn pri" id="downloadBtn">Download<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>
        </div>

        <div class="confirm-wrap" id="confirmwrap" hidden>
          <div class="confirm">
            <div class="confirm-body"><h3>Replace image?</h3><p>You haven&rsquo;t downloaded this one yet &mdash; replacing it will discard your current frame.</p></div>
            <div class="confirm-btns"><button class="cbtn-cancel" id="cCancel">Cancel</button><button class="cbtn-ok" id="cOk">Replace</button></div>
          </div>
        </div>

        <div class="empty" id="empty">
          <div class="drop">
            <div class="dropicon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></div>
            <h2>Upload a photo</h2>
            <p>JPG, PNG, or HEIC. Nothing leaves your device.</p>
            <label class="choose">Choose photo<input id="file" type="file" accept="image/*" hidden></label>
          </div>
        </div>

        <div class="editor" id="editor" hidden>
          <div class="preview" id="preview">
            <div class="wall" id="wall">
              <div class="art" id="art">
                <div class="mat" id="mat">
                  <div class="photo"><img id="pimg" alt=""></div>
                  <span class="sig empty" id="sig"></span>
                </div>
              </div>
            </div>
            <div class="cropview" id="cropview" hidden>
              <img id="cropimg" alt="">
              <div class="cropbox" id="cropbox">
                <div class="crop-grid"></div>
                <span class="crop-h" data-h="nw"></span>
                <span class="crop-h" data-h="ne"></span>
                <span class="crop-h" data-h="sw"></span>
                <span class="crop-h" data-h="se"></span>
              </div>
            </div>
          </div>

          <div class="toolzone">
            <div class="tabs" id="tabs">
              <button class="tab" data-tab="crop">Crop</button>
              <button class="tab on" data-tab="frame">Frame &amp; Mat</button>

                  <div class="row"><span class="lab">Thickness</span><input class="sld" id="mw" type="range" min="0" max="20" value="10" step="1"><span class="val" id="mwv">10</span></div>

<script>
(function(){
  var ARTR=0.8, wallRatio=0.8, artSize=0.72, frameW=6, matW=10;
  var wallColor='#e7e3db', frameColor='#17140f', matColor='#ffffff';
  var sigMode='none', sigX=0.85, sigY=0.88, sigSizeFrac=0.16, sigOpacity=0.9;
  var sigColor='#14110c', sigFont='"Snell Roundhand","Apple Chancery",cursive', sigText='', sigAdded=false, shadowOn=true, downloaded=false;

  var preview=document.getElementById('preview'),wall=document.getElementById('wall'),art=document.getElementById('art'),mat=document.getElementById('mat'),sig=document.getElementById('sig'),pimg=document.getElementById('pimg'),arow=document.getElementById('arow');

  function fit(mw,mh,r){var w,h;if(mw/mh>r){h=mh;w=h*r;}else{w=mw;h=w/r;}return{w:w,h:h};}

  var ratios=[['Original',0.8],['1:1',1],['4:5',0.8],['5:4',1.25],['2:3',0.6667],['3:2',1.5],['3:4',0.75],['4:3',1.3333],['9:16',0.5625],['16:9',1.7778]];
  ratios.forEach(function(r,i){var b=document.createElement('button');b.className='pill'+(i===2?' sel':'');b.textContent=r[0];b.onclick=function(){arow.querySelectorAll('.pill').forEach(function(p){p.classList.remove('sel')});b.classList.add('sel');wallRatio=(i===0?ARTR:r[1]);layout();};arow.appendChild(b);});

  var palettes={
    frame:[['#17140f',1],['#efe9dd',0],['#5a3a24',0],['#b8895a',0],['#b7bcc0',0]],
    mat:[['#ffffff',1],['#f4ecdd',0],['#dad3c7',0],['#2b2b2b',0]],
    wall:[['#e7e3db',1],['#ffffff',0],['#f4f2ec',0],['#c9c3b8',0],['#c3cbbd',0],['#b9c4cc',0],['#e9d8d2',0],['#3a3f45',0],['#24252a',0]]
  };
  Object.keys(palettes).forEach(function(g){
    var host=document.querySelector('.sws[data-group="'+g+'"]');
    palettes[g].forEach(function(c){var s=document.createElement('span');s.className='sw'+(c[1]?' sel':'');s.style.background=c[0];s.onclick=function(){host.querySelectorAll('.sw').forEach(function(x){x.classList.remove('sel')});s.classList.add('sel');if(g==='frame'){frameColor=c[0];art.style.background=c[0];}else if(g==='mat'){matColor=c[0];mat.style.background=c[0];}else{wallColor=c[0];wall.style.background=c[0];}};host.appendChild(s);});
  });

  var photoEl=document.querySelector('.photo'), sigPlace='image';
  function photoFrac(){var mr=mat.getBoundingClientRect(),pr=photoEl.getBoundingClientRect();if(!mr.width)return null;return{mrW:mr.width,mrH:mr.height,px0:(pr.left-mr.left)/mr.width,px1:(pr.right-mr.left)/mr.width,py0:(pr.top-mr.top)/mr.height,py1:(pr.bottom-mr.top)/mr.height};}
  function clampSig(){
    var mr=mat.getBoundingClientRect(), sr=sig.getBoundingClientRect(); if(!mr.width||!sr.width)return;
    var hx=(sr.width/2)/mr.width, hy=(sr.height/2)/mr.height, pf=photoFrac();
    if(!pf){sigX=Math.max(hx,Math.min(1-hx,sigX));sigY=Math.max(hy,Math.min(1-hy,sigY));return;}
    if(sigPlace==='image'){
      var lo=pf.px0+hx,hi=pf.px1-hx; sigX=lo>hi?(pf.px0+pf.px1)/2:Math.max(lo,Math.min(hi,sigX));
      var lo2=pf.py0+hy,hi2=pf.py1-hy; sigY=lo2>hi2?(pf.py0+pf.py1)/2:Math.max(lo2,Math.min(hi2,sigY));
    } else {
      sigX=Math.max(hx,Math.min(1-hx,sigX));
      var tLo=hy,tHi=pf.py0-hy,bLo=pf.py1+hy,bHi=1-hy,tOK=tHi>=tLo,bOK=bHi>=bLo;
      if(tOK&&bOK){ if(sigY<(pf.py0+pf.py1)/2) sigY=Math.max(tLo,Math.min(tHi,sigY)); else sigY=Math.max(bLo,Math.min(bHi,sigY)); }
      else if(bOK) sigY=Math.max(bLo,Math.min(bHi,sigY));
      else if(tOK) sigY=Math.max(tLo,Math.min(tHi,sigY));
      else sigY=1-hy;
    }
  }
  function renderSig(){
    if(sigMode==='none'){sig.classList.add('empty');return;}
    sig.classList.remove('empty');
    sig.style.opacity=sigOpacity;
    var mwpx=mat.clientWidth||1;
    if(sigMode==='text'){var im=sig.querySelector('img');if(im)sig.innerHTML='';sig.textContent=sigText;sig.style.fontFamily=sigFont;sig.style.color=sigColor;sig.style.fontSize=(sigSizeFrac*mwpx)+'px';}
    else{var im2=sig.querySelector('img');if(im2){im2.style.width=(sigSizeFrac*mwpx)+'px';im2.style.height='auto';}}
    // Cap the signature to fit its chosen region (photo, or the mat border).
    var mr=mat.getBoundingClientRect(), sr=sig.getBoundingClientRect(), pf=photoFrac();
    if(mr.width&&sr.width&&pf){
      var maxW,maxH;
      if(sigPlace==='image'){maxW=(pf.px1-pf.px0)*mr.width*0.92;maxH=(pf.py1-pf.py0)*mr.height*0.92;}
      else{maxW=mr.width*0.92;maxH=Math.max(6,pf.py0*mr.height*0.84);}
      var f=Math.min(1,maxW/sr.width,maxH/sr.height);
      if(f<1){if(sigMode==='text'){sig.style.fontSize=(parseFloat(sig.style.fontSize)*f)+'px';}else{var im3=sig.querySelector('img');if(im3)im3.style.width=(parseFloat(im3.style.width)*f)+'px';}}
    }
    clampSig();
    sig.style.left=(sigX*100)+'%'; sig.style.top=(sigY*100)+'%';
  }
  function applyShadow(){
    var p=[];
    if(shadowOn){p.push('0 6px 14px rgba(0,0,0,.3)','0 16px 30px rgba(0,0,0,.2)');}
    if(frameW>0){p.push('inset 0 1px 0 rgba(255,255,255,.14)','inset 0 -2px 4px rgba(0,0,0,.4)');}
    art.style.boxShadow = p.length ? p.join(',') : 'none';
  }
  function desktop(){return document.body.classList.contains('desktop');}
  function layout(hOv){
    var _m=desktop()?64:0;
    var aw=preview.clientWidth-36-_m, ah=(hOv||preview.clientHeight)-28-_m;
    var w=fit(aw,ah,wallRatio); wall.style.width=w.w+'px'; wall.style.height=w.h+'px';
    // Photo is the anchor; mat + frame grow OUTWARD around it (thickness relative to the photo).
    var ph=fit(w.w*artSize,w.h*artSize,ARTR), pShort=Math.min(ph.w,ph.h);
    var fT=frameW/100*pShort, mT=matW/100*pShort, border=mT+fT;
    // Scale the whole piece down only if it would exceed the wall.
    var sc=Math.min(1,(w.w*0.98)/(ph.w+2*border),(w.h*0.98)/(ph.h+2*border));
    var PW=ph.w*sc,PH=ph.h*sc,FT=fT*sc,MT=mT*sc;
    art.style.width=(PW+2*(MT+FT))+'px'; art.style.height=(PH+2*(MT+FT))+'px';
    art.style.padding=FT+'px'; mat.style.padding=MT+'px';
    renderSig();
  }

  document.getElementById('shadowtog').onclick=function(){shadowOn=!shadowOn;this.classList.toggle('on',shadowOn);this.setAttribute('aria-checked',shadowOn);applyShadow();};

  function bindSlider(id,outId,fn){var el=document.getElementById(id),out=document.getElementById(outId);function upd(){var v=+el.value,pct=(v-el.min)/(el.max-el.min)*100;el.style.setProperty('--fill',pct+'%');out.textContent=Math.round(v);fn(v);}el.addEventListener('input',upd);upd();}
  bindSlider('fw','fwv',function(v){frameW=v;applyShadow();layout();});
  bindSlider('mw','mwv',function(v){matW=v;layout();});
  bindSlider('as','asv',function(v){artSize=v/100;layout();});
  bindSlider('ss','ssv',function(v){sigSizeFrac=v/100;renderSig();});
  bindSlider('so','sov',function(v){sigOpacity=v/100;renderSig();});

  var dragging=false;
  sig.addEventListener('pointerdown',function(e){if(sigMode==='none')return;dragging=true;sig.style.cursor='grabbing';try{sig.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
  sig.addEventListener('pointermove',function(e){if(!dragging)return;var r=mat.getBoundingClientRect();sigX=(e.clientX-r.left)/r.width;sigY=(e.clientY-r.top)/r.height;renderSig();});
  sig.addEventListener('pointerup',function(){dragging=false;sig.style.cursor='grab';});

  var sheet=document.getElementById('sheet'),addsig=document.getElementById('addsig'),sigtext=document.getElementById('sigtext'),sigfile=document.getElementById('sigfile'),upprev=document.getElementById('upprev'),sigstate=document.getElementById('sigstate');
  function setText(){var im=sig.querySelector('img');if(im)sig.innerHTML='';sigMode='text';sigText=sigtext.value;renderSig();}
  addsig.onclick=function(){if(!sigAdded){sigMode='text';sigText=sigtext.value;renderSig();}sheet.classList.add('open');};
  document.getElementById('sheetbd').onclick=function(){sheet.classList.remove('open');if(!sigAdded){sigMode='none';renderSig();}};
  document.getElementById('rmsig').onclick=function(){
    sigMode='none';sigAdded=false;sigText='';sig.innerHTML='';sig.className='sig empty';
    try{strokes.length=0;if(typeof drawpad!=='undefined'&&drawpad&&dctx)dctx.clearRect(0,0,drawpad.width,drawpad.height);}catch(_){}
    sigtext.value='';var up=document.getElementById('upprev');if(up){up.hidden=true;up.innerHTML='';}
    var sf=document.getElementById('sigfile');if(sf)sf.value='';
    sigstate.textContent='None';
    document.querySelectorAll('.sigctl').forEach(function(r){r.hidden=true;});
    this.hidden=true;renderSig();
  };
  var sigTab='type';
  document.getElementById('seg2').querySelectorAll('button').forEach(function(b){b.onclick=function(){document.getElementById('seg2').querySelectorAll('button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');var t=b.dataset.t;sigTab=t;document.getElementById('pane-type').hidden=(t!=='type');document.getElementById('pane-draw').hidden=(t!=='draw');document.getElementById('pane-up').hidden=(t!=='up');if(t==='draw')setTimeout(fitPad,0);};});
  var fonts=[['Script','"Snell Roundhand","Apple Chancery",cursive'],['Savoye','"Savoye LET","Snell Roundhand",cursive'],['Chancery','"Apple Chancery",cursive'],['Zapf','Zapfino,"Snell Roundhand",cursive'],['Serif','Didot,Georgia,serif'],['Baskerville','Baskerville,"Times New Roman",serif'],['Palatino','Palatino,"Palatino Linotype",serif'],['Times','"Times New Roman",Times,serif'],['Hand','"Bradley Hand",cursive'],['Marker','"Marker Felt","Comic Sans MS",cursive'],['Note','Noteworthy,"Marker Felt",cursive'],['Chalk','"Chalkboard SE","Comic Sans MS",cursive'],['Sans','"Helvetica Neue",Arial,sans-serif'],['Futura','Futura,"Century Gothic",sans-serif'],['Optima','Optima,Candara,sans-serif'],['Avenir','"Avenir Next",Avenir,sans-serif'],['Gill','"Gill Sans","Gill Sans MT",sans-serif'],['Typewriter','"American Typewriter","Courier New",serif'],['Mono','Menlo,Monaco,monospace']];
  var fhost=document.getElementById('fonts');
  fonts.forEach(function(f,i){var c=document.createElement('button');c.className='fchip'+(i===0?' sel':'');c.textContent=f[0];c.style.fontFamily=f[1];c.onclick=function(){fhost.querySelectorAll('.fchip').forEach(function(x){x.classList.remove('sel')});c.classList.add('sel');sigFont=f[1];setText();};fhost.appendChild(c);});
  var sigcols=[['#14110c',1],['#ffffff',0],['#6b6b6b',0],['#b8bcc2',0],['#b08d57',0],['#8a5a2b',0],['#7a2e2e',0],['#1e2a44',0],['#24402c',0],['#d19a9a',0]];
  var chost=document.getElementById('sigcolors');
  sigcols.forEach(function(c){var s=document.createElement('span');s.className='sw'+(c[1]?' sel':'');s.style.background=c[0];s.onclick=function(){chost.querySelectorAll('.sw').forEach(function(x){x.classList.remove('sel')});s.classList.add('sel');sigColor=c[0];setText();};chost.appendChild(s);});
  sigtext.addEventListener('input',setText);
  sigfile.onchange=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(ev){sig.innerHTML='';var im=document.createElement('img');im.onload=renderSig;im.src=ev.target.result;sigMode='image';sig.appendChild(im);renderSig();upprev.hidden=false;upprev.innerHTML='';var t=document.createElement('img');t.src=ev.target.result;upprev.appendChild(t);};rd.readAsDataURL(f);};
  var drawpad=document.getElementById('drawpad'),dctx=drawpad.getContext('2d'),strokes=[],curStroke=null,drawing=false,penColor='#14110c',penW=4.5;
  function fitPad(){var r=drawpad.getBoundingClientRect();if(!r.width)return;var dpr=Math.min(3,window.devicePixelRatio||1);drawpad.width=Math.round(r.width*dpr);drawpad.height=Math.round(r.height*dpr);dctx.setTransform(dpr,0,0,dpr,0,0);dctx.lineCap='round';dctx.lineJoin='round';redrawPad();}
  function strokePath(ctx,s){ctx.strokeStyle=s.color;ctx.lineWidth=s.width;ctx.fillStyle=s.color;if(s.pts.length===1){ctx.beginPath();ctx.arc(s.pts[0].x,s.pts[0].y,s.width/2,0,7);ctx.fill();}else{ctx.beginPath();ctx.moveTo(s.pts[0].x,s.pts[0].y);for(var i=1;i<s.pts.length;i++)ctx.lineTo(s.pts[i].x,s.pts[i].y);ctx.stroke();}}
  function redrawPad(){dctx.clearRect(0,0,drawpad.width,drawpad.height);strokes.forEach(function(s){strokePath(dctx,s);});}
  function padPt(e){var r=drawpad.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
  drawpad.addEventListener('pointerdown',function(e){drawing=true;curStroke={color:penColor,width:penW,pts:[padPt(e)]};strokes.push(curStroke);redrawPad();try{drawpad.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
  drawpad.addEventListener('pointermove',function(e){if(!drawing)return;curStroke.pts.push(padPt(e));var n=curStroke.pts.length;dctx.strokeStyle=curStroke.color;dctx.lineWidth=curStroke.width;dctx.beginPath();dctx.moveTo(curStroke.pts[n-2].x,curStroke.pts[n-2].y);dctx.lineTo(curStroke.pts[n-1].x,curStroke.pts[n-1].y);dctx.stroke();});
  drawpad.addEventListener('pointerup',function(){drawing=false;});
  drawpad.addEventListener('pointercancel',function(){drawing=false;});
  document.getElementById('undoBtn').onclick=function(){strokes.pop();redrawPad();};
  document.getElementById('clearBtn').onclick=function(){strokes=[];redrawPad();};
  document.getElementById('pensizes').querySelectorAll('button').forEach(function(b){b.onclick=function(){document.getElementById('pensizes').querySelectorAll('button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');penW=+b.dataset.w;};});
  var dchost=document.getElementById('drawcolors');
  sigcols.forEach(function(c){var s=document.createElement('span');s.className='sw'+(c[1]?' sel':'');s.style.background=c[0];s.onclick=function(){dchost.querySelectorAll('.sw').forEach(function(x){x.classList.remove('sel')});s.classList.add('sel');penColor=c[0];};dchost.appendChild(s);});
  function drawingToImage(){
    if(!strokes.length)return null;
    var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9,mw=0;
    strokes.forEach(function(s){mw=Math.max(mw,s.width);s.pts.forEach(function(p){if(p.x<minX)minX=p.x;if(p.x>maxX)maxX=p.x;if(p.y<minY)minY=p.y;if(p.y>maxY)maxY=p.y;});});
    var pad=mw/2+4;minX-=pad;minY-=pad;maxX+=pad;maxY+=pad;
    var bw=Math.max(1,maxX-minX),bh=Math.max(1,maxY-minY),sc=3;
    var tc=document.createElement('canvas');tc.width=Math.round(bw*sc);tc.height=Math.round(bh*sc);
    var t=tc.getContext('2d');t.scale(sc,sc);t.translate(-minX,-minY);t.lineCap='round';t.lineJoin='round';
    strokes.forEach(function(s){strokePath(t,s);});
    return tc.toDataURL('image/png');
  }
  document.getElementById('sigdone').onclick=function(){
    if(sigTab==='draw'){var url=drawingToImage();if(url){sig.innerHTML='';var di=document.createElement('img');di.onload=renderSig;di.src=url;sigMode='image';sig.appendChild(di);}}
    sheet.classList.remove('open');var im=sig.querySelector('img');if(im){sigAdded=true;sigstate.textContent='Image';}else if((sigText||'').trim()){sigAdded=true;sigstate.textContent=sigText;}else{sigMode='none';renderSig();sigstate.textContent='None';return;}document.getElementById('rmsig').hidden=false;document.querySelectorAll('.sigctl').forEach(function(r){r.hidden=false;});renderSig();
  };

  var fileEl=document.getElementById('file'),emptyEl=document.getElementById('empty'),editorEl=document.getElementById('editor');
  function showEditor(){emptyEl.hidden=true;editorEl.hidden=false;document.getElementById('topbtns').hidden=false;rescale();showTab('crop');layout();setTimeout(layout,50);}
  function loadPhoto(src){downloaded=false;origImg=new Image();origImg.onload=function(){cropRect={x:0,y:0,w:origImg.naturalWidth,h:origImg.naturalHeight};cropRatios[0][1]=origImg.naturalWidth/origImg.naturalHeight;var _sp=croparow.querySelector('.pill.sel');if(_sp&&_sp.textContent==='Original')cropRatio=cropRatios[0][1];if(cropview&&!cropview.hidden)renderCrop();};origImg.src=src;cropRatio=null;pimg.onload=function(){ARTR=pimg.naturalWidth/pimg.naturalHeight;ratios[0][1]=ARTR;var op=arow.querySelector('.pill');if(op&&op.classList.contains('sel'))wallRatio=ARTR;showEditor();};pimg.src=src;}
  fileEl.onchange=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(ev){loadPhoto(ev.target.result);};rd.readAsDataURL(f);};

  function drawCover(ctx,img,x,y,w,h){var ir=img.naturalWidth/img.naturalHeight,r=w/h,sx,sy,sw,sh;if(ir>r){sh=img.naturalHeight;sw=sh*r;sx=(img.naturalWidth-sw)/2;sy=0;}else{sw=img.naturalWidth;sh=sw/r;sx=0;sy=(img.naturalHeight-sh)/2;}ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);}
  function runExport(L){
    if(!pimg.naturalWidth)return;
    var CW,CH;
    if(wallRatio>=1){CW=L;CH=Math.round(L/wallRatio);}else{CH=L;CW=Math.round(L*wallRatio);}
    var cv=document.createElement('canvas');cv.width=CW;cv.height=CH;var ctx=cv.getContext('2d');
    ctx.fillStyle=wallColor;ctx.fillRect(0,0,CW,CH);
    var ph=fit(CW*artSize,CH*artSize,ARTR),pShort=Math.min(ph.w,ph.h);
    var fT=frameW/100*pShort,mT=matW/100*pShort,border=mT+fT;
    var sc=Math.min(1,(CW*0.98)/(ph.w+2*border),(CH*0.98)/(ph.h+2*border));
    var PW=ph.w*sc,PH=ph.h*sc,FT=fT*sc,MT=mT*sc;

    if(sigMode!=='none'){

      var onImg=(sigPlace==='image');
      function clampSigXY(cx,cy,sw,sh){

        else{cx=Math.max(mx+sw/2,Math.min(mx+mW-sw/2,cx));cy=(cy<my+mH/2)?Math.max(my+sh/2,Math.min(py-sh/2,cy)):Math.max(py+ph2+sh/2,Math.min(my+mH-sh/2,cy));}
        return[cx,cy];
      }

        var tw=ctx.measureText(sigText||'').width||1,capW=onImg?pw*0.92:mW*0.92,capH=onImg?ph2*0.92:Math.max(6,MT*0.84);
        var f=Math.min(1,capW/tw,capH/fpx);fpx*=f;ctx.font='italic '+fpx+'px '+sigFont;tw=ctx.measureText(sigText||'').width;
        var p=clampSigXY(mx+sigX*mW,my+sigY*mH,tw,fpx);
        ctx.fillStyle=sigColor;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(sigText||'',p[0],p[1]);
      } else {
        var si=sig.querySelector('img');
        if(si){var sw=sigSizeFrac*mW,sh=sw*(si.naturalHeight/si.naturalWidth),capW2=onImg?pw*0.92:mW*0.92,capH2=onImg?ph2*0.92:Math.max(6,MT*0.84),f2=Math.min(1,capW2/sw,capH2/sh);sw*=f2;sh*=f2;
          var p2=clampSigXY(mx+sigX*mW,my+sigY*mH,sw,sh);
          ctx.drawImage(si,p2[0]-sw/2,p2[1]-sh/2,sw,sh);}
      }
      ctx.restore();
    }
    cv.toBlob(function(b){var a2=document.createElement('a');a2.href=URL.createObjectURL(b);a2.download='framed-print.png';document.body.appendChild(a2);a2.click();downloaded=true;setTimeout(function(){URL.revokeObjectURL(a2.href);a2.remove();},1200);},'image/png');
  }
  var exportsheet=document.getElementById('exportsheet');
  document.getElementById('exbd').onclick=function(){exportsheet.classList.remove('open');};
  document.querySelectorAll('.exopt').forEach(function(b){b.onclick=function(){exportsheet.classList.remove('open');runExport(+b.dataset.size);};});

  function doReplace(){fileEl.value='';fileEl.click();}
  document.getElementById('replaceBtn').onclick=function(){if(downloaded){doReplace();}else{document.getElementById('confirmwrap').hidden=false;}};
  document.getElementById('downloadBtn').onclick=function(){if(pimg.naturalWidth)exportsheet.classList.add('open');};
  document.getElementById('cCancel').onclick=function(){document.getElementById('confirmwrap').hidden=true;};
  document.getElementById('cOk').onclick=function(){document.getElementById('confirmwrap').hidden=true;doReplace();};

  document.getElementById('sigplace').querySelectorAll('button').forEach(function(b){b.onclick=function(){document.getElementById('sigplace').querySelectorAll('button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');sigPlace=b.dataset.p;renderSig();};});

  var origImg=new Image(), cropRect=null, cropRatio=null;
  var cropview=document.getElementById('cropview'),cropimg=document.getElementById('cropimg'),cropbox=document.getElementById('cropbox'),cropScale=1,cropDrag=null;
  var croparow=document.getElementById('croparow'),cropRatios=[['Original',0],['Free',0],['1:1',1],['4:5',0.8],['5:4',1.25],['2:3',0.6667],['3:2',1.5],['3:4',0.75],['4:3',1.3333]];
  cropRatios.forEach(function(r,i){var b=document.createElement('button');b.className='pill'+(i===0?' sel':'');b.textContent=r[0];b.onclick=function(){croparow.querySelectorAll('.pill').forEach(function(p){p.classList.remove('sel')});b.classList.add('sel');setCropRatio(r[1]);};croparow.appendChild(b);});
  function setCropRatio(rv){cropRatio=rv||null;if(cropRatio&&cropRect&&origImg.naturalWidth){var iw=origImg.naturalWidth,ih=origImg.naturalHeight,cx=cropRect.x+cropRect.w/2,cy=cropRect.y+cropRect.h/2,nw=cropRect.w,nh=nw/cropRatio;if(nh>ih){nh=ih;nw=nh*cropRatio;}if(nw>iw){nw=iw;nh=nw/cropRatio;}cropRect={x:Math.max(0,Math.min(iw-nw,cx-nw/2)),y:Math.max(0,Math.min(ih-nh,cy-nh/2)),w:nw,h:nh};}renderCrop();}
  function renderCrop(){if(!origImg.naturalWidth||!cropRect)return;if(cropimg.getAttribute('src')!==origImg.src)cropimg.src=origImg.src;var pv=preview.getBoundingClientRect();if(!pv.width)return;var f=fit(pv.width*0.86,pv.height-44,origImg.naturalWidth/origImg.naturalHeight);cropimg.style.width=f.w+'px';cropimg.style.height=f.h+'px';cropScale=f.w/origImg.naturalWidth;var ir=cropimg.getBoundingClientRect(),cvr=cropview.getBoundingClientRect();cropbox.style.left=((ir.left-cvr.left)+cropRect.x*cropScale)+'px';cropbox.style.top=((ir.top-cvr.top)+cropRect.y*cropScale)+'px';cropbox.style.width=(cropRect.w*cropScale)+'px';cropbox.style.height=(cropRect.h*cropScale)+'px';}
  function cropStart(e,mode){if(!cropRect)return;cropDrag={mode:mode,sx:e.clientX,sy:e.clientY,r:{x:cropRect.x,y:cropRect.y,w:cropRect.w,h:cropRect.h}};e.preventDefault();e.stopPropagation();try{e.target.setPointerCapture(e.pointerId);}catch(_){}}
  cropbox.addEventListener('pointerdown',function(e){cropStart(e,'move');});
  [].slice.call(cropbox.querySelectorAll('.crop-h')).forEach(function(h){h.addEventListener('pointerdown',function(e){cropStart(e,h.dataset.h);});});
  document.addEventListener('pointermove',function(e){if(!cropDrag||!origImg.naturalWidth)return;var dx=(e.clientX-cropDrag.sx)/cropScale,dy=(e.clientY-cropDrag.sy)/cropScale,r=cropDrag.r,iw=origImg.naturalWidth,ih=origImg.naturalHeight;
    if(cropDrag.mode==='move'){cropRect={x:Math.max(0,Math.min(iw-r.w,r.x+dx)),y:Math.max(0,Math.min(ih-r.h,r.y+dy)),w:r.w,h:r.h};}
    else{var m=cropDrag.mode,x0=r.x,y0=r.y,x1=r.x+r.w,y1=r.y+r.h;if(m.indexOf('w')>=0)x0=r.x+dx;if(m.indexOf('e')>=0)x1=r.x+r.w+dx;if(m.indexOf('n')>=0)y0=r.y+dy;if(m.indexOf('s')>=0)y1=r.y+r.h+dy;
      if(cropRatio){var nw2=Math.max(24,x1-x0),nh2=nw2/cropRatio;if(m.indexOf('w')>=0)x0=x1-nw2;else x1=x0+nw2;if(m.indexOf('n')>=0)y0=y1-nh2;else y1=y0+nh2;}
      x0=Math.max(0,x0);y0=Math.max(0,y0);x1=Math.min(iw,x1);y1=Math.min(ih,y1);var minS=Math.max(24,iw*0.05);if(x1-x0<minS){if(m.indexOf('w')>=0)x0=x1-minS;else x1=x0+minS;}if(y1-y0<minS){if(m.indexOf('n')>=0)y0=y1-minS;else y1=y0+minS;}
      cropRect={x:x0,y:y0,w:x1-x0,h:y1-y0};}
    renderCrop();});
  document.addEventListener('pointerup',function(){cropDrag=null;});
  document.getElementById('cropReset').onclick=function(){if(origImg.naturalWidth){cropRect={x:0,y:0,w:origImg.naturalWidth,h:origImg.naturalHeight};cropRatios[0][1]=origImg.naturalWidth/origImg.naturalHeight;cropRatio=cropRatios[0][1];croparow.querySelectorAll('.pill').forEach(function(p,i){p.classList.toggle('sel',i===0);});renderCrop();}};
  document.getElementById('cropDone').onclick=function(){showTab('frame');};
  function applyCrop(){if(!origImg.naturalWidth||!cropRect)return;var c=document.createElement('canvas');c.width=Math.max(1,Math.round(cropRect.w));c.height=Math.max(1,Math.round(cropRect.h));c.getContext('2d').drawImage(origImg,cropRect.x,cropRect.y,cropRect.w,cropRect.h,0,0,c.width,c.height);pimg.onload=function(){ARTR=pimg.naturalWidth/pimg.naturalHeight;ratios[0][1]=ARTR;var op=arow.querySelector('.pill.sel');if(op&&op.textContent==='Original')wallRatio=ARTR;layout();};pimg.src=c.toDataURL('image/png');}

  var tabEls=[].slice.call(document.querySelectorAll('.tab')),panelEls=[].slice.call(document.querySelectorAll('.panel'));
  var panelsEl=document.querySelector('.panels'),toolzoneEl=document.querySelector('.toolzone'),tabTimer,collapsed=false;
  function showTab(name){
    var prevEl=tabEls.filter(function(t){return t.classList.contains('on');})[0], prev=prevEl?prevEl.dataset.tab:null;
    collapsed=false;
    tabEls.forEach(function(t){t.classList.toggle('on',t.dataset.tab===name);});
    if(name==='crop'){cropview.hidden=false;wall.style.visibility='hidden';}
    else{if(prev==='crop')applyCrop();cropview.hidden=true;wall.style.visibility='';}
    if(desktop()){
      panelEls.forEach(function(p){p.hidden=(p.dataset.panel!==name);});
      panelsEl.style.height=''; layout();
      if(name==='crop'){renderCrop();setTimeout(renderCrop,40);setTimeout(renderCrop,160);}
      return;
    }
    var startH=panelsEl.offsetHeight;
    panelEls.forEach(function(p){p.hidden=(p.dataset.panel!==name);});
    panelsEl.style.height='auto';
    var endH=panelsEl.offsetHeight, finalPrev=editorEl.clientHeight-toolzoneEl.offsetHeight;
    panelsEl.style.height=startH+'px'; void panelsEl.offsetHeight; panelsEl.style.height=endH+'px';
    preview.classList.add('animating'); layout(finalPrev);
    if(name==='crop'){renderCrop();setTimeout(renderCrop,40);}
    clearTimeout(tabTimer); tabTimer=setTimeout(function(){panelsEl.style.height='auto';preview.classList.remove('animating');layout();if(!cropview.hidden)renderCrop();},450);
  }
  function collapsePanel(){
    if(desktop()||collapsed)return;
    var activeEl=tabEls.filter(function(t){return t.classList.contains('on');})[0], active=activeEl?activeEl.dataset.tab:null;
    if(active==='crop'){applyCrop();cropview.hidden=true;wall.style.visibility='';}
    collapsed=true;
    tabEls.forEach(function(t){t.classList.remove('on');});
    var startH=panelsEl.offsetHeight;
    panelEls.forEach(function(p){p.hidden=true;});
    panelsEl.style.height='0px';
    var finalPrev=editorEl.clientHeight-toolzoneEl.offsetHeight;
    panelsEl.style.height=startH+'px'; void panelsEl.offsetHeight; panelsEl.style.height='0px';
    preview.classList.add('animating'); layout(finalPrev);
    clearTimeout(tabTimer); tabTimer=setTimeout(function(){preview.classList.remove('animating');layout();},450);
  }
  tabEls.forEach(function(t){t.onclick=function(){if(!desktop()&&!collapsed&&t.classList.contains('on')){collapsePanel();}else{showTab(t.dataset.tab);}};});
  preview.addEventListener('click',function(e){if(desktop()||collapsed)return;if(e.target.closest('.sig')||e.target.closest('.cropbox'))return;collapsePanel();});

  var scaler=document.getElementById('scaler'),phone=document.getElementById('phone');
  function rescale(){
    var vw=window.innerWidth,vh=window.innerHeight;
    var isDesk=vw>=768;
    document.body.classList.toggle('desktop',isDesk);
    if(isDesk){
      // Desktop / tablet: no phone bezel — the tool fills the window (canvas + sidebar).
      phone.classList.add('bare');phone.style.width=vw+'px';phone.style.height=vh+'px';
      scaler.style.transform='none';scaler.style.width=vw+'px';scaler.style.height=vh+'px';
    } else {
      // Mobile: unchanged — bare, full-screen.
      phone.classList.add('bare');phone.style.width=vw+'px';phone.style.height=vh+'px';
      scaler.style.transform='none';scaler.style.width=vw+'px';scaler.style.height=vh+'px';
    }
  }
  window.addEventListener('resize',function(){rescale();layout();});
  rescale();
})();
